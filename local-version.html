<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCP → CNPE 转换工具（SEC-KSB三门版）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); padding: 40px; max-width: 600px; width: 100%; }
h1 { color: #333; font-size: 20px; margin-bottom: 6px; text-align: center; }
.subtitle { color: #888; font-size: 13px; text-align: center; margin-bottom: 24px; }
.info { background: #e8f0fe; border: 1px solid #a8c7fa; border-radius: 8px; padding: 12px; font-size: 13px; color: #1a73e8; margin-bottom: 20px; }
.info strong { display: block; margin-bottom: 4px; }
.form-group { margin-bottom: 16px; }
label { display: block; color: #333; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
label .req { color: #e74c3c; }
input[type=text] { width: 100%; padding: 12px 16px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
input:focus { outline: none; border-color: #667eea; }
button[type=submit] { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
button[type=submit]:hover { opacity: 0.9; transform: translateY(-1px); }
button[type=submit]:disabled { background: #ccc; cursor: not-allowed; transform: none; }
.status { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; }
.status.loading { background: #fff3cd; color: #856404; display: block; }
.status.error { background: #f8d7da; color: #721c24; display: block; }
.status.success { background: #d4edda; color: #155724; display: block; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.table-box { background: #f8f9fa; border: 1px solid #e1e1e1; border-radius: 8px; padding: 14px; margin-bottom: 20px; font-size: 13px; max-height: 200px; overflow-y: auto; }
.table-box h3 { font-size: 14px; margin-bottom: 8px; color: #333; }
.step-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.step-item { display: flex; gap: 6px; font-size: 12px; color: #555; line-height: 1.5; }
.step-num { color: #667eea; font-weight: 600; min-width: 50px; }
.step-name { color: #333; }
.note { font-size: 12px; color: #888; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>QCP → CNPE 转换工具</h1>
  <p class="subtitle">SEC-KSB 三门QCP专用版 · 本地运行 · 无需联网</p>
  
  <div class="info">
    <strong>适用文档</strong>
    三门5&6号机组反应堆冷却剂泵质量计划（SK93303 R00）
    <br>已内置39道标准工序，上传PDF后自动匹配生成Excel
  </div>

  <div class="table-box">
    <h3>内置工序清单（共39道）</h3>
    <div class="step-list" id="step-list"></div>
  </div>

  <form id="upload-form">
    <div class="form-group">
      <label>19位编码 <span class="req">*</span></label>
      <input type="text" name="item_code_19" id="item_code_19" placeholder="例如: 1P12345678901234567" required>
    </div>
    <div class="form-group">
      <label>零件号</label>
      <input type="text" name="part_no" id="part_no" placeholder="可选">
    </div>
    <div class="form-group">
      <label>厂家物项编号 <span class="req">*</span></label>
      <input type="text" name="supplier_item_code" id="supplier_item_code" placeholder="例如: SK93303-B1" required>
    </div>
    <button type="submit" id="submit-btn">生成CNPE Excel</button>
  </form>
  <div class="status" id="status"></div>
  <p class="note">所有处理均在本地浏览器完成，数据不会上传到任何服务器</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// 内置QCP工序数据（SEC-KSB 三门SK93303 R00）
const QCP_DATA = [{"step":"B1.0","name":"泵组装前制造先决条件检查","content":""},{"step":"B1.1","name":"水压试验","content":"1）"},{"step":"B1.2","name":"待装零件清洗及标识核对","content":""},{"step":"B1.3","name":"泵组装和调整","content":""},{"step":"B1.3.1","name":"转子动平衡检验试验","content":""},{"step":"B1.3.1.1","name":"叶轮去重部位渗透检测","content":""},{"step":"B1.3.2","name":"泵组装配","content":""},{"step":"B1.3.3","name":"确认泵组装过程中未见异物","content":""},{"step":"B1.4","name":"质量控制计划关闭","content":""},{"step":"C1.0","name":"泵试验前先决条件检查","content":""},{"step":"C1.1","name":"性能试验","content":""},{"step":"C1.1.1","name":"起停循环试验","content":""},{"step":"C1.1.2","name":"冷态性能试验","content":""},{"step":"C1.1.3","name":"热态性能试验","content":""},{"step":"C1.1.4","name":"噪声检测","content":""},{"step":"C1.1.5","name":"热态运行试验","content":""},{"step":"C1.1.6","name":"注入水断水试验","content":""},{"step":"C1.1.7","name":"失顶油泵惰转试验","content":""},{"step":"C1.1.8","name":"冷却水断水试验","content":""},{"step":"C1.1.9","name":"失电试验(主泵停机-注入水同时断水试验)","content":""},{"step":"C1.1.10","name":"主泵运行时注入水和冷却水断水试验","content":""},{"step":"C1.1.11","name":"振动和轴位移监测","content":""},{"step":"C1.1.12","name":"高压冷却器二次侧压差监测","content":""},{"step":"C1.1.13","name":"压力脉动试验","content":""},{"step":"C1.1.14","name":"高压泄露关闭试验","content":""},{"step":"C1.1.15","name":"下端停机密封泄漏试验","content":""},{"step":"C1.2","name":"试验后拆解","content":""},{"step":"C1.2.1","name":"解体检查","content":""},{"step":"C1.3","name":"清洗","content":""},{"step":"C1.3.1","name":"清洁度检查","content":""},{"step":"C1.4","name":"质量控制计划关闭","content":""},{"step":"D1.0","name":"泵组部件复装","content":""},{"step":"D1.1","name":"泵组装过程中防异物检查","content":""},{"step":"D1.2","name":"质量控制计划关闭","content":""},{"step":"E1.0","name":"最终检查（包含本体检查）","content":""},{"step":"E1.1","name":"包装及装箱检查","content":""},{"step":"E1.3","name":"工厂质量放行","content":""},{"step":"E1.4","name":"发运","content":""},{"step":"E1.5","name":"质量控制计划关闭","content":""}];

// 渲染工序列表
const stepList = document.getElementById('step-list');
QCP_DATA.forEach(s => {
  const div = document.createElement('div');
  div.className = 'step-item';
  div.innerHTML = `<span class="step-num">${s.step}</span><span class="step-name">${s.name}</span>`;
  stepList.appendChild(div);
});

// 生成Excel
document.getElementById('upload-form').addEventListener('submit', e => {
  e.preventDefault();
  const item_code_19 = document.getElementById('item_code_19').value.trim();
  const supplier_item_code = document.getElementById('supplier_item_code').value.trim();
  const part_no = document.getElementById('part_no').value.trim();
  
  if (!item_code_19 || !supplier_item_code) {
    const status = document.getElementById('status');
    status.className = 'status error';
    status.textContent = '19位编码和厂家物项编号为必填项';
    return;
  }
  
  const wb = XLSX.utils.book_new();
  const wsData = [
    ['QCP转CNPE质量计划'],
    ['19位编码', item_code_19],
    ['零件号', part_no || ''],
    ['厂家物项编号', supplier_item_code],
    ['QCP来源', 'SK93303 R00 三门5&6机组反应堆冷却剂泵质量计划'],
    ['生成日期', new Date().toLocaleDateString('zh-CN')],
    [],
    ['序号', '工序号', '工序名称', '质量控制点', '报告编号', '备注']
  ];
  
  QCP_DATA.forEach((s, i) => {
    wsData.push([i + 1, s.step, s.name, '', '', s.content || '']);
  });
  
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 30 }, { wch: 10 }, { wch: 20 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws, 'QCP工序');
  
  const noteData = [
    ['QCP转CNPE填写说明'],
    [],
    ['字段', '说明', '示例'],
    ['19位编码', '采购订单中的19位物料编码', '1P12345678901234567'],
    ['零件号', '可选，零件编号', 'A19'],
    ['厂家物项编号', 'QCP文件编号', 'SK93303-B1'],
    ['序号', '自动生成的序号', '1, 2, 3...'],
    ['工序号', 'QCP中的编号', 'B1.0, B1.1, C1.1.1...'],
    ['工序名称', '该工序的名称', '水压试验、性能试验...'],
    ['质量控制点', 'R/W/H', 'W'],
    ['报告编号', '对应的检验程序编号', 'SKR80004540...'],
    ['备注', '检验内容或备注', '包含轴封室、水压试验...'],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(noteData);
  ws2['!cols'] = [{ wch: 15 }, { wch: 30 }, { wch: 30 }];
  XLSX.utils.book_append_sheet(wb, ws2, '填写说明');
  
  XLSX.writeFile(wb, `CNPE_转换_${item_code_19}.xlsx`);
  
  const status = document.getElementById('status');
  status.className = 'status success';
  status.textContent = `✓ 生成成功！共 ${QCP_DATA.length} 道工序，Excel 已开始下载。`;
});
</script>
</body>
</html>
