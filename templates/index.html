<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCP质量计划 → CNPE Excel 转换工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 560px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        label .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="text"].optional {
            border-color: #ddd;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f6ff;
        }

        .upload-area.dragover {
            background: #f0eeff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 16px;
        }

        .upload-text {
            color: #666;
            font-size: 14px;
        }

        .upload-text strong {
            color: #667eea;
        }

        #file-input {
            display: none;
        }

        .file-info {
            margin-top: 12px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            display: none;
        }

        .file-name {
            font-weight: 500;
            word-break: break-all;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Password overlay */
        #password-screen {
            display: none;
        }

        #password-screen.active {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 999;
        }

        .password-box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .password-box h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 8px;
            text-align: center;
        }

        .password-box p {
            color: #666;
            font-size: 13px;
            text-align: center;
            margin-bottom: 24px;
        }

        .password-box input[type="password"] {
            margin-bottom: 16px;
        }

        .password-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .password-box button:hover {
            opacity: 0.9;
        }

        #login-error {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Password screen -->
    <div id="password-screen">
        <div class="password-box">
            <h2>QCP转换工具</h2>
            <p>请输入访问密码</p>
            <input type="password" id="password-input" placeholder="请输入密码" onkeydown="if(event.key==='Enter')document.getElementById('login-btn').click()">
            <button id="login-btn" onclick="doLogin()">确认</button>
            <div id="login-error">密码错误，请重试</div>
        </div>
    </div>

    <!-- Main app -->
    <div class="container hidden" id="main-app">
        <h1>QCP质量计划 → CNPE Excel 转换工具</h1>
        <p class="subtitle">自动识别PDF类型 · 提取工序数据 · 填充CNPE模板</p>

        <form id="upload-form" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>19位编码 <span class="required">*</span></label>
                <input type="text" name="item_code_19" placeholder="例如: 1P12345678901234567" required>
            </div>

            <div class="form-group">
                <label>零件号</label>
                <input type="text" name="part_no" class="optional" placeholder="可选">
            </div>

            <div class="form-group">
                <label>厂家物项编号 <span class="required">*</span></label>
                <input type="text" name="supplier_item_code" placeholder="必填" required>
            </div>

            <div class="upload-area" id="upload-area">
                <div class="upload-icon">📄</div>
                <div class="upload-text">
                    <strong>点击选择PDF文件</strong> 或拖拽文件到这里
                </div>
                <input type="file" id="file-input" name="file" accept=".pdf" required>
            </div>

            <div class="file-info" id="file-info">
                <div class="file-name" id="file-name"></div>
            </div>

            <button type="submit" id="submit-btn">开始转换</button>
        </form>

        <div class="status" id="status"></div>
    </div>

    <script>
        // Check auth state on load
        document.addEventListener('DOMContentLoaded', () => {
            const authenticated = {{ 'true' if authenticated else 'false' }};
            if (authenticated) {
                showApp();
            } else {
                showPasswordScreen();
            }
        });

        function showPasswordScreen() {
            document.getElementById('password-screen').classList.add('active');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('password-input').focus();
        }

        function showApp() {
            document.getElementById('password-screen').classList.remove('active');
            document.getElementById('main-app').classList.remove('hidden');
        }

        async function doLogin() {
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password})
                });

                if (res.ok) {
                    showApp();
                } else {
                    errorEl.style.display = 'block';
                    document.getElementById('password-input').value = '';
                    document.getElementById('password-input').focus();
                }
            } catch(e) {
                errorEl.style.display = 'block';
                errorEl.textContent = '网络错误，请重试';
            }
        }

        // Upload logic
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const form = document.getElementById('upload-form');
        const submitBtn = document.getElementById('submit-btn');
        const status = document.getElementById('status');

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) showFileInfo(e.target.files[0]);
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                showFileInfo(e.dataTransfer.files[0]);
            }
        });

        function showFileInfo(file) {
            fileName.textContent = file.name;
            fileInfo.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            status.className = 'status loading';
            status.innerHTML = '<span class="spinner"></span>正在处理，请稍候...';
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = response.headers.get('Content-Disposition')?.match(/filename=(.+)/)?.[1] || 'output.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    status.className = 'status success';
                    status.textContent = '✓ 转换完成！文件已下载。';
                } else {
                    const error = await response.json();
                    status.className = 'status error';
                    status.textContent = '✗ ' + (error.error || '处理失败');
                }
            } catch (err) {
                status.className = 'status error';
                status.textContent = '✗ 网络错误，请重试';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
