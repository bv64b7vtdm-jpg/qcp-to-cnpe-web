<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCP → CNPE 转换工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 560px; width: 100%; }
        h1 { color: #333; font-size: 22px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #333; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        label .req { color: #e74c3c; }
        input[type=text], input[type=password] { width: 100%; padding: 12px 16px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        .upload-area { border: 2px dashed #667eea; border-radius: 12px; padding: 36px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
        .upload-area:hover { border-color: #764ba2; background: #f8f6ff; }
        .upload-icon { font-size: 42px; margin-bottom: 12px; }
        .upload-text { color: #666; font-size: 14px; }
        .upload-text strong { color: #667eea; }
        #file-input { display: none; }
        .file-info { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 13px; display: none; }
        button[type=submit] { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button[type=submit]:hover { opacity: 0.9; transform: translateY(-1px); }
        button[type=submit]:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .status { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; }
        .status.loading { background: #fff3cd; color: #856404; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #app { display: none; }
        #app.active { display: block; }
        #password-screen { display: flex; align-items: center; justify-content: center; }
        #password-screen.hidden { display: none; }
        .password-box { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .password-box h2 { color: #333; font-size: 20px; margin-bottom: 6px; }
        .password-box p { color: #888; font-size: 13px; margin-bottom: 20px; }
        .password-box input { margin-bottom: 14px; }
        .password-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        #login-error { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div id="password-screen" class="container">
        <div class="password-box">
            <h2>QCP 转换工具</h2>
            <p>请输入访问密码</p>
            <input type="password" id="password-input" placeholder="请输入密码" onkeydown="if(event.key==='Enter')document.getElementById('login-btn').click()">
            <button id="login-btn" onclick="doLogin()">确认</button>
            <div id="login-error">密码错误，请重试</div>
        </div>
    </div>

    <div id="app" class="container">
        <h1>QCP → CNPE 转换工具</h1>
        <p class="subtitle">上传 QCP PDF，自动提取工序数据，生成 CNPE 格式 Excel</p>
        <form id="upload-form">
            <div class="form-group">
                <label>19位编码 <span class="req">*</span></label>
                <input type="text" name="item_code_19" placeholder="例如: 1P12345678901234567" required>
            </div>
            <div class="form-group">
                <label>零件号</label>
                <input type="text" name="part_no" placeholder="可选">
            </div>
            <div class="form-group">
                <label>厂家物项编号 <span class="req">*</span></label>
                <input type="text" name="supplier_item_code" placeholder="必填" required>
            </div>
            <div class="upload-area" id="upload-area">
                <div class="upload-icon">📄</div>
                <div class="upload-text"><strong>点击选择PDF文件</strong> 或拖拽文件到这里</div>
                <input type="file" id="file-input" name="file" accept=".pdf" required>
            </div>
            <div class="file-info" id="file-info"><div id="file-name"></div></div>
            <button type="submit" id="submit-btn">开始转换</button>
        </form>
        <div class="status" id="status"></div>
    </div>

    <script>
        const API_BASE = '/api';
        const PASSWORD_KEY = 'qcp_app_auth';

        function checkAuth() {
            if (sessionStorage.getItem(PASSWORD_KEY) === 'true') {
                showApp();
            }
        }

        function showApp() {
            document.getElementById('password-screen').classList.add('hidden');
            document.getElementById('app').classList.add('active');
        }

        async function doLogin() {
            const pw = document.getElementById('password-input').value;
            try {
                const res = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: pw})
                });
                if (res.ok) {
                    sessionStorage.setItem(PASSWORD_KEY, 'true');
                    showApp();
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            } catch(e) {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // Upload
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const form = document.getElementById('upload-form');
        const submitBtn = document.getElementById('submit-btn');
        const status = document.getElementById('status');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => { if(e.target.files[0]) showFile(e.target.files[0]); });
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#764ba2'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#667eea'; });
        uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = '#667eea'; if(e.dataTransfer.files[0]) showFile(e.dataTransfer.files[0]); });

        function showFile(f) {
            fileName.textContent = f.name;
            fileInfo.style.display = 'block';
        }

        form.addEventListener('submit', async e => {
            e.preventDefault();
            status.className = 'status loading';
            status.innerHTML = '<span class="spinner"></span>正在处理，请稍候...';
            submitBtn.disabled = true;

            const fd = new FormData(form);
            try {
                const res = await fetch(API_BASE + '/upload', { method: 'POST', body: fd });
                if (res.ok) {
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = res.headers.get('Content-Disposition')?.match(/filename=(.+)/)?.[1] || 'output.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    status.className = 'status success';
                    status.textContent = '✓ 转换完成！文件已下载。';
                } else {
                    const err = await res.json().catch(() => ({error: '处理失败'}));
                    status.className = 'status error';
                    status.textContent = '✗ ' + err.error;
                }
            } catch(err) {
                status.className = 'status error';
                status.textContent = '✗ 网络错误，请重试';
            } finally {
                submitBtn.disabled = false;
            }
        });

        checkAuth();
    </script>
</body>
</html>
