<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCP → CNPE 转换工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 560px; width: 100%; }
h1 { color: #333; font-size: 22px; margin-bottom: 8px; text-align: center; }
.subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 28px; }
.info-box { background: #e8f0fe; border: 1px solid #a8c7fa; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 13px; color: #1a73e8; }
.info-box strong { display: block; margin-bottom: 4px; }
.form-group { margin-bottom: 18px; }
label { display: block; color: #333; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
label .req { color: #e74c3c; }
input[type=text] { width: 100%; padding: 12px 16px; border: 2px solid #e1e1e1; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
input:focus { outline: none; border-color: #667eea; }
.upload-area { border: 2px dashed #667eea; border-radius: 12px; padding: 36px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
.upload-area:hover { border-color: #764ba2; background: #f8f6ff; }
.upload-icon { font-size: 42px; margin-bottom: 12px; }
.upload-text { color: #666; font-size: 14px; }
.upload-text strong { color: #667eea; }
#file-input { display: none; }
.file-info { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 13px; display: none; }
button[type=submit] { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
button[type=submit]:hover { opacity: 0.9; transform: translateY(-1px); }
button[type=submit]:disabled { background: #ccc; cursor: not-allowed; transform: none; }
.status { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; }
.status.loading { background: #fff3cd; color: #856404; display: block; }
.status.error { background: #f8d7da; color: #721c24; display: block; }
.status.success { background: #d4edda; color: #155724; display: block; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>QCP → CNPE 转换工具</h1>
  <p class="subtitle">上传 QCP PDF 自动转 CNPE 格式 Excel</p>
  
  <div class="info-box">
    <strong>使用说明</strong>
    上传 QCP 质量计划 PDF，系统自动解析表格中的工序数据，输出 CNPE 格式 Excel。
  </div>

  <form id="upload-form">
    <div class="form-group">
      <label>19位编码 <span class="req">*</span></label>
      <input type="text" name="item_code_19" id="item_code_19" placeholder="例如: 1P12345678901234567" required>
    </div>
    <div class="form-group">
      <label>零件号</label>
      <input type="text" name="part_no" id="part_no" placeholder="可选">
    </div>
    <div class="form-group">
      <label>厂家物项编号 <span class="req">*</span></label>
      <input type="text" name="supplier_item_code" id="supplier_item_code" placeholder="必填" required>
    </div>
    <div class="upload-area" id="upload-area">
      <div class="upload-icon">📄</div>
      <div class="upload-text"><strong>点击选择PDF文件</strong> 或拖拽文件到这里</div>
      <input type="file" id="file-input" name="file" accept=".pdf" required>
    </div>
    <div class="file-info" id="file-info"><span id="file-name"></span></div>
    <button type="submit" id="submit-btn">开始转换</button>
  </form>
  <div class="status" id="status"></div>
</div>

<script>
const API_URL = '';

const uploadArea = document.getElementById('upload-area');
const fileInput = document.getElementById('file-input');
const fileInfo = document.getElementById('file-info');
const fileName = document.getElementById('file-name');
const form = document.getElementById('upload-form');
const submitBtn = document.getElementById('submit-btn');
const status = document.getElementById('status');

uploadArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if(e.target.files[0]) { fileName.textContent = e.target.files[0].name; fileInfo.style.display = 'block'; }});
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#764ba2'; });
uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#667eea'; });
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = '#667eea'; if(e.dataTransfer.files[0]) { fileName.textContent = e.dataTransfer.files[0].name; fileInfo.style.display = 'block'; }});

function setStatus(cls, html) { status.className = 'status ' + cls; status.innerHTML = html; }

form.addEventListener('submit', async e => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) { setStatus('error', '请先选择PDF文件'); return; }
  if (file.size > 50 * 1024 * 1024) { setStatus('error', '文件大小不能超过50MB'); return; }
  
  const item_code_19 = document.getElementById('item_code_19').value.trim();
  const supplier_item_code = document.getElementById('supplier_item_code').value.trim();
  const part_no = document.getElementById('part_no').value.trim();
  
  if (!item_code_19 || !supplier_item_code) {
    setStatus('error', '19位编码和厂家物项编号为必填项');
    return;
  }

  setStatus('loading', '<span class="spinner"></span>正在上传并处理，请稍候...');
  submitBtn.disabled = true;

  const formData = new FormData();
  formData.append('file', file);
  formData.append('item_code_19', item_code_19);
  formData.append('supplier_item_code', supplier_item_code);
  formData.append('part_no', part_no);

  try {
    const r = await fetch(API_URL + '/upload', { method: 'POST', body: formData });
    if (r.status === 422) {
      const d = await r.json();
      setStatus('error', '⚠️ ' + (d.error || '未能从PDF中识别到工序数据'));
      submitBtn.disabled = false;
      return;
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      setStatus('error', '✗ 错误：' + (d.error || r.statusText));
      submitBtn.disabled = false;
      return;
    }
    
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `CNPE_转换_${item_code_19}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);
    
    setStatus('success', '✓ 转换成功！Excel 已开始下载。');
  } catch(err) {
    setStatus('error', '✗ 网络错误：' + err.message);
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
